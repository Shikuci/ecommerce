{% extends 'base.html' %}
{% load static %}

{% block title %}Home | Django Online Shopping{% endblock %}

<section class="section-intro padding-y-sm">
    <div class="container">
        <div class="intro-banner-wrap">
            <img src="{% static 'images/banners/1.jpg' %}"
                 class="img-fluid rounded"
                 alt="Shopping banner">

    </div>
</section>
