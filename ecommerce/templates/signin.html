{% extends 'base.html' %}
{% block title %}Sign In | GreatKart{% endblock %}
{% block content %}
<section class="section-content padding-y" style="min-height:84vh"><div class="container"><div class="card mx-auto" style="max-width:380px;margin-top:100px"><div class="card-body"><h4 class="card-title mb-4">Sign In</h4>
{% for message in messages %}<div class="alert alert-{{ message.tags }}">{{ message }}</div>{% endfor %}
<form method="post">{% csrf_token %}<div class="form-group"><label for="email">Username, email, or phone number</label><input type="text" id="email" name="email" class="form-control" autocomplete="username" required></div><div class="form-group"><label for="password">Password</label><input type="password" id="password" name="password" class="form-control" autocomplete="current-password" required></div><button type="submit" class="btn btn-primary btn-block">Login</button></form></div></div><p class="text-center mt-4">Don't have an account? <a href="{% url 'register' %}">Sign Up</a></p></div></section>
{% endblock %}
